name: Build and Release aspnetcore JS

on:
  workflow_dispatch:
    inputs:
      tagname:
        description: '手动指定aspnetcore标签（可选，如果留空，将自动获取最新标签）'
        required: false
        type: string
  schedule:
    # Execute at 8am on the 1st of each month (UTC time)
    - cron: '0 8 1 * *'

jobs:

  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check-release.outputs.tag }}
      name: ${{ steps.check-release.outputs.name }}
      skip: ${{ steps.check-release.outputs.skip }}
      is_latest: ${{ steps.check-release.outputs.is_latest }}

    steps:
      - name: 获取aspnetcore releases信息
        id: check-release
        run: |
          latest=$(curl -s https://api.github.com/repos/dotnet/aspnetcore/releases/latest)

          if [ -n "${{ inputs.tagname }}" ]; then
            echo "使用手动指定的 tag: ${{ inputs.tagname }}"

            release=$(curl -s https://api.github.com/repos/dotnet/aspnetcore/releases/tags/${{ inputs.tagname }})

            if [ "$latest" == "$release" ]; then
                is_latest="true"
            else
                is_latest="false"
            fi
          else
            echo "未指定 tag，自动获取最新 release"

            release=$latest
            is_latest="true"
          fi

          echo "is_latest=$is_latest" >> $GITHUB_OUTPUT

          tag=$(echo "$release" | jq -r '.tag_name // empty')
          name=$(echo "$release" | jq -r '.name // empty')

          if [ -n "$tag" ]; then
            echo "tag=$tag" >> $GITHUB_OUTPUT
            echo "name=$name" >> $GITHUB_OUTPUT
          else
            echo "标签名不存在或不正确，跳过构建。"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          existing=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | jq -r '.id // empty')
          if [ -n "$existing" ]; then
            echo "该版本已存在，跳过构建。"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 输出检查结果
        run: |
          echo "Tag: ${{ steps.check-release.outputs.tag }}"
          echo "Name: ${{ steps.check-release.outputs.name }}"
          echo "Skip: ${{ steps.check-release.outputs.skip }}"
          echo "Is Latest: ${{ steps.check-release.outputs.is_latest }}"

  build-and-release:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 克隆 aspnetcore 对应版本分支
        run: |
          git clone --depth=1 --branch "${{ needs.check.outputs.tag }}" https://github.com/dotnet/aspnetcore.git
          cd aspnetcore
          git log -1 --oneline

      - name: 安装最新 LTS 版本 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: 修改 tsconfig.json 中 target 为 ES2019
        working-directory: aspnetcore/src/Components/Shared.JS
        run: |
          jq '.compilerOptions.target = "ES2019"' tsconfig.json > tmp.json && mv tmp.json tsconfig.json
          echo "修改后的 tsconfig.json:"
          cat tsconfig.json

      - name: 构建项目
        working-directory: aspnetcore
        run: |
          npm ci
          npm run build

      - name: 收集构建产物
        run: |
          mkdir artifacts
          cp -r aspnetcore/src/Components/Web.JS/dist/Release/* artifacts/
          ls -la artifacts

      - name: 重命名 JS 文件为 *.es2019.js
        run: |
          rename 's/\.js/\.es2019.js/' artifacts/*

          echo "重命名后的文件："
          ls -la artifacts

      # Update to Github Releases
      - name: 发布 Release
        uses: svenstaro/upload-release-action@v2
        with:
            repo_token: ${{ secrets.GITHUB_TOKEN }}
            file: "artifacts/*"
            file_glob: true
            release_name: ${{ needs.check.outputs.name }}
            tag: ${{ needs.check.outputs.tag }}
            body: "Automated build of aspnetcore JavaScript assets for ${{ needs.check.outputs.tag }}"
            make_latest: ${{ needs.check.outputs.is_latest }}
